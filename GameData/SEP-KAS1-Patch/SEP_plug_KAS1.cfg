// SEP-KAS1-Patch: makes the Surface Experiment Pack 2.7.x "AKI Power Transfer Conduit"
// (SEP_plug) work with KAS 1.x.
//
// SEP still ships the legacy KASModulePort/KASModuleStrut modules, which were removed in
// KAS 1.0, so the "Link" action never appears and experiments can't be connected to the
// Central Station. This replaces them with the KAS 1.x equivalents, following KAS's own
// Patches/MM-LegacyKASPipesPart.txt template.
//
// Usage is unchanged: KIS-attach one plug to the station and one to the experiment, then
// on EVA right-click a plug -> Link and click the other plug. AlwaysCoupled merges the
// experiment into the station's vessel, which is what ModuleSEPStation relies on.
//
// Plugs that already existed in KIS inventories or on vessels before installing this
// patch keep their old part snapshot and will fail to link; re-create them in the VAB.

@PART[SEP_plug]:NEEDS[KAS,SurfaceExperimentPackage]:FINAL
{
	!MODULE[KASModulePort] {}
	!MODULE[KASModuleStrut] {}

	// KAS 1.x (>= 1.0): the legacy KASModulePort/KASModuleStrut modules were removed in KAS 1.0.
	// Follows KAS's own Patches/MM-LegacyKASPipesPart.txt template.
	// Active end: shows Link/Unlink in the part action window. AlwaysCoupled merges the linked
	// experiment into the station's vessel, which is what ModuleSEPStation needs to see it.
	MODULE
	{
		name = KASLinkSourceInteractive

		// AbstractLinkPeer
		linkType = SEPPlug
		linkTypeDisplayName = #LOC_SurfaceExperimentPack_plug_title
		attachNodeName = kasSrcAuto0
		// position of the "plugNode" transform in the model (top of the plug, pointing up)
		attachNodeDef = 0.0, 0.107, 0.0,  0.0, 1.0, 0.0,  0
		allowCoupling = true

		// KASLinkSourceBase
		coupleMode = AlwaysCoupled
		jointName = plugJoint
		linkRendererName = plugCable
		sndPathDock = KAS/Sounds/plugdocked
		sndPathUndock = KAS/Sounds/unplugdocked

		// KASLinkSourceInteractive
		sndPathPlug = KAS/Sounds/plug
		sndPathUnplug = KAS/Sounds/unplug
		sndPathBroke = KAS/Sounds/broke
		startLinkMenu = Link
		breakLinkMenu = Unlink
	}
	// Passive end: lets another plug link to this one.
	MODULE
	{
		name = KASLinkTargetBase

		linkType = SEPPlug
		linkTypeDisplayName = #LOC_SurfaceExperimentPack_plug_title
		attachNodeName = kasTgtAuto0
		attachNodeDef = 0.0, 0.107, 0.0,  0.0, 1.0, 0.0,  0
		allowCoupling = true
	}
	// Cable visual, reusing SEP's own pipe texture.
	MODULE
	{
		name = KASRendererPipe

		rendererName = plugCable
		pipeTextureRescaleMode = TileFromSource
		pipeDiameter = 0.02
		pipeTexturePath = SurfaceExperimentPackage/Parts/pipe
		pipeNormalsTexturePath =
		pipeTextureSamplesPerMeter = 4

		sourceJoint
		{
			sphereOffset = 0.01
			sphereDiameter = 0.03
			armDiameter = 0.02
		}
		targetJoint
		{
			sphereOffset = 0.01
			sphereDiameter = 0.03
			armDiameter = 0.02
		}
	}
	// Same limits as the original KASModuleStrut (30 m, 100 deg, break force 600).
	MODULE
	{
		name = KASJointRigid

		jointName = plugJoint
		minLinkLength = 0
		maxLinkLength = 30
		linkBreakForce = 600
		sourceLinkAngleLimit = 100
		targetLinkAngleLimit = 100
		anchorAtSource = 0, 0, 0
		anchorAtTarget = 0, 0, 0
	}

}
